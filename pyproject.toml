[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodhub-delivery-analysis"
version = "0.1.0"
description = "Reproducible exploratory analysis of food delivery operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<4", "matplotlib>=3.8,<4"]

[project.scripts]
foodhub-analyze = "foodhub_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
